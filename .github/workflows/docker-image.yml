name: Docker Image CI

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Get version
      id: version
      run: echo "tag=$(cat .tags)" >> $GITHUB_OUTPUT

    - name: Docker Setup Buildx
      uses: docker/setup-buildx-action@v3

    - name: DockerHub Login
      uses: docker/login-action@v3
      with:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Github Login
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64
        push: true
        cache-from: type=gha
        cache-to: type=gha,mode=max
        # Fetching ROCm from ROCm/TheRock's public CI artifacts (Dockerfile
        # step 2) resolves the run via the GitHub REST API first - the bare
        # runner has an ambiently-authenticated `gh` CLI, but a Docker build
        # container doesn't, so that step falls back to unauthenticated
        # requests and can get rate-limited into returning zero artifacts
        # (hit this exact failure on the first two runs of this rewrite,
        # 2026-08-25). Pass the job's own GITHUB_TOKEN in as a build secret
        # (not a build-arg, so it never lands in an image layer) to give it
        # the same auth stack-torch-gfx1151's own bare-runner fetch step
        # gets for free.
        secrets: |
          GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
        tags: |
          ${{ github.repository }}:latest
          ${{ github.repository }}:${{ steps.version.outputs.tag }}
          ghcr.io/${{ github.repository }}:latest
          ghcr.io/${{ github.repository }}:${{ steps.version.outputs.tag }}
