name: Docker Image CI

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # The assembled image is ~32GB (ROCm 7.14 tarball ~16GB extracted +
    # torch/triton/vllm + ~200 deps). A stock ubuntu-latest runner has
    # ~21GB free on / where Docker's data-root lives — not enough. Reclaim
    # the preinstalled toolchains we never use (~25GB).
    - name: Free disk space
      run: |
        df -h /
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
          /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
          /usr/share/swift /usr/local/.ghcup
        sudo docker image prune --all --force || true
        df -h /

    - name: Get version
      id: version
      run: echo "tag=$(cat .tags)" >> $GITHUB_OUTPUT

    - name: Docker Setup Buildx
      uses: docker/setup-buildx-action@v3

    - name: DockerHub Login
      uses: docker/login-action@v3
      with:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Github Login
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # No gha cache: the layers worth caching (ROCm tarball, torch install)
    # are each larger than the 10GB GHA cache budget, so it only churns
    # evictions. A pure-assembly rebuild is ~15-20 min from cold.
    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64
        push: true
        tags: |
          ${{ github.repository }}:latest
          ${{ github.repository }}:${{ steps.version.outputs.tag }}
          ghcr.io/${{ github.repository }}:latest
          ghcr.io/${{ github.repository }}:${{ steps.version.outputs.tag }}
